<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一日導師</title>
<style>
:root{--main:#ff8a5b;--ink:#33302b;--line:#e6dccd}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(#ffe2b8,#fff7e8);min-height:100vh;display:flex;justify-content:center}
#app{width:min(720px,100%);padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:13px;color:#8a7560}
.clock{font-size:30px;font-weight:800;color:var(--main)}
#prog{font-weight:700}
.bar{height:12px;background:#f3dcc0;border-radius:8px;overflow:hidden;margin:10px 0}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--main),#ffc145);transition:width .4s}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(120,70,20,.12);padding:16px}
.scene-wrap svg{width:100%;height:auto;display:block;border-radius:14px}
.title{font-size:21px;font-weight:800;margin:12px 0 4px}
.text{font-size:16px;line-height:1.75}
.choices button,.primary{display:block;width:100%;text-align:left;margin:9px 0;padding:12px 14px;font-size:16px;line-height:1.5;border:2px solid var(--line);background:#fffdf9;border-radius:12px;cursor:pointer;font-family:inherit;color:var(--ink)}
.choices button:hover{border-color:var(--main);background:#fff4ec}
.primary{text-align:center;background:var(--main);border-color:var(--main);color:#fff;font-weight:700;margin-top:14px}
.primary:hover{filter:brightness(1.05)}
.note{margin-top:12px;padding:10px 12px;background:#f7f4ef;border-left:4px solid #b8a48a;border-radius:8px;font-size:15px;line-height:1.7}
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.show{display:flex}
.box{background:#fff;border-radius:20px;padding:18px;max-width:600px;width:100%;max-height:92vh;overflow:auto}
.box .scene-wrap svg{width:100%;height:auto;display:block;border-radius:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="sub">一日導師 · 國小校園生存記</div><div id="clock" class="clock">07:00</div></div>
    <div id="prog"></div>
  </header>
  <div class="bar"><div id="bar"></div></div>
  <div id="card" class="card"></div>
</div>
<div id="overlay" class="overlay"><div class="box" id="box"></div></div>

/* ---------- 插圖工具 ---------- */
function P(x,y,shirt,hair,s){
  hair=hair||'#3b2a20'; s=s||1;
  return `<g transform="translate(${x},${y}) scale(${s})">
    <rect x="-16" y="-6" width="32" height="44" rx="10" fill="${shirt}"/>
    <circle r="16" cy="-22" fill="#ffd9b0"/>
    <path d="M-16,-24 Q0,-46 16,-24 Q10,-34 0,-34 Q-10,-34 -16,-24Z" fill="${hair}"/>
    <circle cx="-5" cy="-21" r="2" fill="#333"/><circle cx="5" cy="-21" r="2" fill="#333"/>
    <path d="M-5,-13 Q0,-9 5,-13" stroke="#333" fill="none" stroke-width="1.5"/></g>`;
}
function R(x,y,w,h,f,extra){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra||''}/>`;}
function C(x,y,r,f){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;}
function T(x,y,txt,size,f){return `<text x="${x}" y="${y}" font-size="${size||14}" text-anchor="middle" fill="${f||'#333'}" font-family="Microsoft JhengHei,PingFang TC,sans-serif">${txt}</text>`;}
function B(sky,ground){return R(0,0,400,150,sky)+R(0,150,400,70,ground);}
function scene(k){
  const f=SCENES[k]||SCENES.class;
  return `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">${f()}</svg>`;
}

/* ---------- 遊戲流程（不以顏色或文字透露答案）---------- */
let idx=0, order=[];
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setHUD(clock,prog,pct){$('#clock').textContent=clock;$('#prog').textContent=prog;$('#bar').style.width=pct+'%';}

function renderIntro(){
  setHUD('07:00','',0);
  $('#card').innerHTML=`<div class="scene-wrap">${scene('gate')}</div>
    <div class="title">一日導師</div>
    <div class="text">你是一位國小導師。從早上到校門，到放學鐘響，今天會遇到 ${EVENTS.length} 幕狀況。每一幕都有幾種做法，<b>只要有一次選錯，就會被送進校事會議，今天必須從頭來過</b>。請用你的專業與同理心，撐完整整一天。</div>
    <button class="primary" id="start">開始今天的工作</button>`;
  $('#start').onclick=()=>{idx=0;renderEvent();};
}

function renderEvent(){
  const ev=EVENTS[idx];
  setHUD(ev.t,`第 ${idx+1} / ${EVENTS.length} 幕`,idx/EVENTS.length*100);
  order=shuffle(ev.c);
  $('#card').innerHTML=`<div class="scene-wrap">${scene(ev.s)}</div>
    <div class="title">${ev.title}</div>
    <div class="text">${ev.text}</div>
    <div class="choices">${order.map((c,i)=>`<button data-i="${i}">${c[0]}</button>`).join('')}</div>`;
  document.querySelectorAll('#card .choices button').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}

function choose(i){
  const ev=EVENTS[idx], c=order[i];
  if(c[1]){
    const last=idx+1>=EVENTS.length;
    $('#card').innerHTML=`<div class="scene-wrap">${scene(ev.s)}</div>
      <div class="title">處理完成</div>
      <div class="text">你選擇了：「${c[0]}」</div>
      <div class="note">${c[2]}</div>
      <button class="primary" id="next">${last?'放學':'下一幕'}</button>`;
    $('#next').onclick=()=>{idx++; idx<EVENTS.length?renderEvent():renderEnd();};
  } else {
    showMeeting(ev,c);
  }
}

function showMeeting(ev,c){
  $('#box').innerHTML=`<div class="scene-wrap">${scene('meeting')}</div>
    <div class="title">📋 你被送進校事會議</div>
    <div class="text">在「${ev.title}」這一幕中，你選擇了：「${c[0]}」</div>
    <div class="note">${c[2]}</div>
    <button class="primary" id="retry">重新開始這一天</button>`;
  $('#overlay').classList.add('show');
  $('#retry').onclick=()=>{$('#overlay').classList.remove('show');idx=0;renderEvent();};
}

function renderEnd(){
  setHUD('16:50','放學',100);
  $('#card').innerHTML=`<div class="scene-wrap">${scene('gate')}</div>
    <div class="title">🔔 放學鐘響了！</div>
    <div class="text">你一整天都做出了合宜的判斷，順利撐過 ${EVENTS.length} 幕事件，沒有被送進校事會議。學生們揮手說再見，你終於可以好好下班了。</div>
    <button class="primary" id="again">再玩一次</button>`;
  $('#again').onclick=renderIntro;
}

renderIntro();
</script>
