<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>良率報告生存戰</title>
<meta name="description" content="半導體工程師上台報告良率異常，面對副總、協理、廠長與一整排處長經理的連番追問。大事化小、小事化無，活著下台。">
<meta property="og:title" content="良率報告生存戰">
<meta property="og:description" content="大事化小、小事化無。你能活著走下台嗎？">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1420; --bg2:#161e2e; --panel:#1b2436; --line:#2b3750;
  --ink:#e8edf6; --mute:#8d9ab3; --dim:#5d6a84;
  --heat:#ff5a4e; --cred:#33c7b0; --own:#f2b33d; --hl:#7cc4ff;
  --slide:#f7f6f2; --slideInk:#1d2433; --corp:#163a6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#22304a 0%,var(--bg) 60%)}
#app{max-width:780px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",monospace}

/* title */
.title-wrap{padding:40px 4px 8px;text-align:center}
.kicker{font-size:12px;letter-spacing:.3em;color:var(--mute)}
h1.game{font-size:clamp(34px,9vw,58px);font-weight:900;margin:6px 0 2px;letter-spacing:.04em;line-height:1.15}
h1.game span{color:var(--heat)}
.tag{color:var(--mute);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.rules{font-size:14px;color:#c7d0e0}
.rules b{color:var(--ink)}
.rules ul{padding-left:20px;margin:8px 0}
.field{display:flex;gap:10px;align-items:center;margin:16px 0 6px;flex-wrap:wrap}
.field input[type=text]{flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-top:8px}
.btn{background:var(--heat);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-size:16px;letter-spacing:.05em;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.full{width:100%}
.center{text-align:center}

/* HUD */
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:8px 0 10px}
.stagebar{display:flex;gap:6px;margin-bottom:8px}
.stagebar div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stagebar div.done{background:var(--cred)}
.stagebar div.now{background:var(--own)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12px}
.stat label{display:flex;justify-content:space-between;color:var(--mute)}
.bar{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .5s}
.meta{grid-column:1/-1;display:flex;gap:14px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:500}

/* seats */
.room{margin:6px 0 14px}
.room-label{font-size:11px;color:var(--dim);letter-spacing:.2em;margin-bottom:6px;display:flex;justify-content:space-between}
.seats{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.seat{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 2px 4px;text-align:center;font-size:10px;line-height:1.25;color:var(--mute);transition:all .25s}
.seat .av{font-size:17px;line-height:1.2}
.seat .nm{color:#c7d0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.own{border-color:#6b5520}
.seat.own .nm{color:var(--own)}
.seat.talk{border-color:var(--hl);box-shadow:0 0 0 2px var(--hl),0 0 18px rgba(124,196,255,.45);background:#1f3150;transform:translateY(-2px)}
.seat.talk.own{border-color:var(--own);box-shadow:0 0 0 2px var(--own),0 0 18px rgba(242,179,61,.45);background:#3a2e14}
.seat .mad{position:absolute;top:-6px;right:-4px;font-size:12px}
@media (max-width:560px){.seats{grid-template-columns:repeat(6,1fr)}}

/* slide */
.slide{background:var(--slide);color:var(--slideInk);border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 8px #0a0e16;margin:8px 0 18px}
.slide .sh{background:var(--corp);color:#fff;padding:8px 14px;font-size:12px;display:flex;justify-content:space-between;gap:10px}
.slide .sb{padding:16px 18px 10px}
.slide h3{margin:0 0 10px;font-size:19px;color:var(--corp);border-bottom:3px solid #d7262e;display:inline-block;padding-bottom:2px}
.slide ul{margin:0;padding-left:20px;font-size:14.5px}
.slide li{margin:3px 0}
.slide li.warn{color:#b3261e;font-weight:700}
.slide .sf{font-size:10px;color:#8a8f99;padding:6px 14px;border-top:1px solid #e3e1da;display:flex;justify-content:space-between}
.slide svg{width:100%;height:auto;display:block;margin:6px 0 4px}

/* dialogue */
.bubble{border-radius:14px;padding:12px 14px;margin:10px 0;position:relative;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble .who{font-size:12px;color:var(--mute);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.bubble .who b{color:var(--ink)}
.bubble.q{background:#1f2c45;border:1px solid #2f4468}
.bubble.q .txt{font-size:17px;font-weight:500}
.bubble.me{background:#26313f;border:1px solid #3b4a5e;margin-left:28px}
.bubble.own-help{background:#1d3a33;border:1px solid #2f6b5d}
.bubble.own-stab{background:#43201f;border:1px solid #7d3532}
.bubble.sys{background:transparent;border:1px dashed var(--line);color:var(--mute);font-size:14px;text-align:center}
.chip{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--ink)}
.chip.own{background:var(--own);color:#2a1d00}
.chip.help{background:#2f6b5d}
.chip.stab{background:#9a3a35}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.55;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--hl);background:#202c43}
.opt .k{color:var(--hl);font-family:"JetBrains Mono",monospace;margin-right:6px;font-weight:700}

.timer{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--own);width:100%}

.delta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px;font-size:13px}
.delta span{padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.up-heat{color:var(--heat)} .dn-heat{color:var(--cred)}
.up-cred{color:var(--cred)} .dn-cred{color:var(--heat)}
.react{color:var(--mute);font-size:14px;margin:4px 0 0 4px}

.stage-head{text-align:center;margin:22px 0 6px}
.stage-head .n{font-size:12px;letter-spacing:.35em;color:var(--own)}
.stage-head h2{margin:2px 0;font-size:28px;font-weight:900}
.stage-head p{margin:0;color:var(--mute);font-size:14px}

.end h2{font-size:34px;margin:6px 0;font-weight:900}
.end .rank{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;letter-spacing:.1em}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.sumgrid div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sumgrid b{display:block;font-size:22px;font-family:"JetBrains Mono",monospace}
.sumgrid small{color:var(--mute);font-size:11px}
.epi{color:#c7d0e0;font-size:14.5px}
.foot{color:var(--dim);font-size:11px;text-align:center;margin-top:28px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9}
</style>
</head>
<body>
<div id="app"></div>

function startStage(){
  const st=STAGES[G.stage];
  // 記仇的人優先發問
  const pool=shuffle(st.pool);
  const pri=pool.filter(q=>G.grudges.has(q.a)).slice(0,2);
  const rest=pool.filter(q=>!pri.includes(q));
  let queue=shuffle(pri.concat(rest).slice(0,4));
  // 記仇但這關沒題目的人 → 突襲
  const holder=[...G.grudges].find(id=>!queue.some(q=>q.a===id));
  if(holder){queue.splice(1+Math.floor(Math.random()*queue.length),0,ambush(holder))}
  if(st.final) queue.push(st.final);
  G.queue=queue; G.qi=0; G.talk=null; G.settled=false;
  app.innerHTML=hud()+`<div class="stage-head"><div class="n">STAGE ${G.stage+1} / 4</div><h2>${st.name}</h2><p>${st.sub}</p></div>`+slideHTML(st)+
    `<button class="btn full" id="nx">報告完畢，開放提問（${queue.length} 題）</button>`;
  $('#nx').onclick=askQ;
  window.scrollTo(0,0);
}

  const p=P[id], d=p.d||'我們';
  return {a:id, ambush:true, q:`剛剛你說是我們${d}的問題，我想請問一下，你有數據嗎？`, o:[

    ['x','（假裝沒聽到，切下一頁）',15,-8,0]
  ]};
}
function askQ(){
  if(G.qi>=G.queue.length) return stageClear();
  const q=G.queue[G.qi];
  if(q.final && G.debt>=3 && !G.settled){ G.settled=true; return reckoning(); }
  G.talk=q.a; const p=P[q.a];
  const opts=shuffle(q.o);
  const tag=q.final?'<span class="chip" style="background:var(--heat)">最終題</span>':q.ambush?'<span class="chip stab">記仇追殺</span>':'';
  app.innerHTML=hud()+room()+`
    <div class="bubble q"><div class="who"><span>${p.e}</span><b>${p.n}</b><span class="chip">${p.t}</span>${tag}<span style="margin-left:auto" class="mono">${G.qi+1}/${G.queue.length}</span></div><div class="txt">${q.q}</div></div>
    ${G.timed?'<div class="timer"><i id="tm"></i></div>':''}
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span>${o[1]}</button>`).join('')}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{stopTimer();answer(q,opts[+b.dataset.i])});
  if(G.timed) startTimer(q);
  $('.bubble.q').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function startTimer(q){
  const T=20000, t0=Date.now(), bar=$('#tm');
  bar.style.transition='none';bar.style.width='100%';
  requestAnimationFrame(()=>{bar.style.transition=`width ${T}ms linear`;bar.style.width='0%'});
  timerId=setTimeout(()=>{timerId=null;answer(q,['x','……（你沉默了 20 秒，會議室的冷氣聲特別清楚）',15,-6,0],true)},T);
}
function stopTimer(){ if(timerId){clearTimeout(timerId);timerId=null} }

function apply(dh,dc,df){
  G.heat=clamp(G.heat+dh,0,100); G.cred=clamp(G.cred+dc,0,100); G.favor=clamp(G.favor+(df||0),-50,50);
}
function answer(q,o,timeout){
  const [type,text,dh,dc,df,ex={}]=o;
  const p=P[q.a];
  let notes=[];
  let h=dh, c=dc;
  if(G.grudges.has(q.a)&&!q.ambush){h+=6;notes.push(`（${p.n}顯然還記得你剛剛甩鍋給他）`)}
  apply(h,c,df);
  if(type==='h')G.honest++; if(type==='b')G.blame++; if(type==='s')G.smooth++; if(type==='p')G.promise++;
  if(ex.d)G.debt+=ex.d;
  if(q.ambush)G.grudges.delete(q.a);
  let grudgeLine='';
  if(ex.g&&!P[ex.g].own){G.grudges.add(ex.g);grudgeLine=`<div class="react">😠 ${P[ex.g].t} ${P[ex.g].n} 默默記住了你的名字。</div>`}
  const totalH=h, totalC=c;
  let react=rnd(REACT[type]);
  // 部門插話
  let inter='';
  if(!q.final && !lost() && Math.random()<0.4){
    const helpP=clamp(.5+G.favor/80,.12,.88);
    const isHelp=Math.random()<helpP;
    const line=rnd(isHelp?HELP:STAB); const sp=P[line[0]];
    apply(line[2],line[3],0);
    inter=`<div class="bubble ${isHelp?'own-help':'own-stab'}"><div class="who"><span>${sp.e}</span><b>${sp.n}</b><span class="chip own">你的部門</span><span class="chip ${isHelp?'help':'stab'}">${isHelp?'神救援':'背後補刀'}</span></div>${line[1].replace('{N}',esc(G.name))}
      <div class="delta">${dTag('heat',line[2])}${dTag('cred',line[3])}</div></div>`;
  }
  G.qi++;
  const done=lost();
  app.innerHTML=hud()+room()+`
    <div class="bubble q"><div class="who"><span>${p.e}</span><b>${p.n}</b><span class="chip">${p.t}</span></div><div class="txt">${q.q}</div></div>
    <div class="bubble me"><div class="who"><span>🧑‍💻</span><b>${esc(G.name)}</b><span class="chip">你</span></div>${text}
      <div class="delta">${dTag('heat',totalH)}${dTag('cred',totalC)}${ex.d?`<span>📝 支票 +${ex.d}</span>`:''}</div></div>
    <div class="react">${p.n} ${react}</div>${notes.map(n=>`<div class="react">${n}</div>`).join('')}${grudgeLine}
    ${inter}
    <button class="btn full" id="nx" style="margin-top:14px">${done?'……':'下一位'}</button>`;
  if(totalH>=15||done) app.classList.add('shake'), setTimeout(()=>app.classList.remove('shake'),400);
  $('#nx').onclick=()=>done?ending(done):askQ();
  $('#nx').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function dTag(k,v){
  if(!v)return'';
  const lbl=k==='heat'?'怒氣':'可信度';
  const cls=k==='heat'?(v>0?'up-heat':'dn-heat'):(v>0?'up-cred':'dn-cred');
  return `<span class="${cls}">${lbl} ${v>0?'+':''}${v}</span>`;
}
function lost(){ if(G.heat>=100)return'heat'; if(G.cred<=0)return'cred'; return null }
function reckoning(){
  G.talk='avp';
  const add=G.debt*4; apply(add,-G.debt*2,0);
  app.innerHTML=hud()+room()+`
    <div class="bubble q"><div class="who"><span>${P.avp.e}</span><b>${P.avp.n}</b><span class="chip">${P.avp.t}</span><span class="chip stab">支票清算</span></div>
    <div class="txt">等一下，在副總問最後一題之前——你今天一共承諾了 <b>${G.debt}</b> 件事，我全部都記下來了，會後我會一項一項追。</div>
    <div class="delta">${dTag('heat',add)}${dTag('cred',-G.debt*2)}</div></div>
    <button class="btn full" id="nx">${lost()?'……':'（吞了一下口水）'}</button>`;
  const l=lost();
  $('#nx').onclick=()=>l?ending(l):askQ();
}
function stageClear(){
  G.talk=null; stopTimer();
  const st=STAGES[G.stage];
  if(G.stage===STAGES.length-1) return ending('win');
  apply(-5,0,0);
  app.innerHTML=hud()+room()+`<div class="stage-head"><div class="n">STAGE ${G.stage+1} CLEAR</div><h2>「${st.name}」過關</h2><p>你按下一頁。會議室稍微放鬆了一點（怒氣 −5）。</p></div>
    <button class="btn full" id="nx">下一頁簡報 ▶</button>`;
  $('#nx').onclick=()=>{G.stage++;startStage()};
}
function ending(kind){
  stopTimer(); G.talk=null;
  let title,rank,color,desc;
  if(kind==='heat'){
    title='被請下台';rank='GAME OVER';color='var(--heat)';
    desc=`${P.vp.n}把筆一放：「夠了。這個案子品保處接手，<b>${esc(G.name)}</b> 下週一直接來我辦公室。」你在 ${G.stage+1} 關倒下。`;
  }else if(kind==='cred'){
    title='報告被打槍';rank='GAME OVER';color='var(--heat)';
    desc=`${P.avp.n}：「這份報告沒有一句話我能相信。<b>全部重做</b>，週五再報一次。」你在 ${G.stage+1} 關倒下。`;
  }else{
    const cool=G.heat<45, trust=G.cred>=35;
    if(cool&&trust){title='太極宗師';rank='S';color='var(--own)';desc=`${P.vp.n}看了看錶：「好，下一個議題。」你什麼都說了，也什麼都沒說。`}
    else if(cool){title='滑溜泥鰍';rank='A';color='var(--cred)';desc='你安全下台，但每個人都覺得哪裡怪怪的，只是說不出來。'}
    else if(trust){title='被列管的老實人';rank='B';color='var(--hl)';desc=`${P.vp.n}：「這個案子列入重點追蹤，<b>每週</b>來週會報進度。」`}
    else {title='驚險過關';rank='C';color='var(--mute)';desc='你走下台時，手心全是汗。張經理拍拍你的肩：「還活著就好。」'}
  }
  const epi=[];
  if(kind==='win'){
    if(G.debt>=3)epi.push(`📝 你今天開出的 ${G.debt} 張支票，下週會一張一張回來找你。`);
    if(G.grudges.size)epi.push(`😠 ${[...G.grudges].map(id=>P[id].n).join('、')}，這筆帳還沒算完。`);
    if(G.honest>=4)epi.push('🫡 你說了好幾次實話。雖然很痛，但這是今天會議室裡最有價值的資訊。');
    if(G.honest===0)epi.push('🤐 你一句實話都沒說。ET-07 Chamber C 還在線上跑貨。');
    epi.push(rnd(['📉 W43，Falcon-28 良率又掉了 3%。','📧 會議結束 5 分鐘後，你收到一封標題為「Re: Re: Re: FW: 良率」的信。','☕ 你在茶水間聽到有人說：「剛剛那個報告講得真好，但到底講了什麼？」']));
  }
  app.innerHTML=`<div class="end center" style="padding-top:28px">
    <span class="rank" style="background:${color};color:#111">${rank}</span>
    <h2>${title}</h2><p class="epi">${desc}</p></div>
    <div class="sumgrid">
      <div><b style="color:var(--heat)">${G.heat}</b><small>最終怒氣</small></div>
      <div><b style="color:var(--cred)">${G.cred}</b><small>可信度</small></div>
      <div><b>${G.stage+(kind==='win'?1:0)}/4</b><small>過關數</small></div>
      <div><b>${G.smooth}</b><small>打太極</small></div>
      <div><b>${G.blame}</b><small>甩鍋</small></div>
      <div><b>${G.honest}</b><small>說實話</small></div>
    </div>
    ${epi.length?`<div class="card epi">${epi.map(e=>`<p style="margin:4px 0">${e}</p>`).join('')}</div>`:''}
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn ghost" id="sh" style="flex:1">分享戰績</button>
      <button class="btn" id="again" style="flex:1">再報告一次</button>
    </div>
    <div class="foot">本遊戲純屬虛構，如有雷同，請勿對號入座。</div>`;
  $('#again').onclick=titleScreen;
  $('#sh').onclick=()=>share(`我在《良率報告生存戰》拿到「${title}」（怒氣 ${G.heat}／可信度 ${G.cred}，說實話 ${G.honest} 次）。你能活著下台嗎？`);
  window.scrollTo(0,0);
}
function share(text){
  const url=location.href.split('#')[0];
  if(navigator.share){navigator.share({title:'良率報告生存戰',text,url}).catch(()=>{});return}
  const full=text+' '+url;
  (navigator.clipboard?navigator.clipboard.writeText(full):Promise.reject()).then(()=>toast('已複製到剪貼簿'),()=>prompt('複製這段文字：',full));
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

titleScreen();
</script>
</body>
</html>
